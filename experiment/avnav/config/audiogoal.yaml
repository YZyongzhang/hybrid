ENVIRONMENT:
  MAX_EPISODE_STEPS: 200

SIMULATOR:
  HABITAT_SIM_V0:
    GPU_DEVICE_ID: 0
  SENSORS: ["DEPTH_SENSOR"]
  RGB_SENSOR:
    WIDTH: 128
    HEIGHT: 128
  DEPTH_SENSOR:
    WIDTH: 128
    HEIGHT: 128
  TYPE: "SoundSpacesSim"
  ACTION_SPACE_CONFIG: "v0"
  SCENE_DATASET: "mp3d"
  GRID_SIZE: 1.0
  AUDIO:
    RIR_SAMPLING_RATE: 16000

TASK:
  TYPE: AudioNav
  SUCCESS_DISTANCE: 1.0
  SENSORS: ["SPECTROGRAM_SENSOR"]
  GOAL_SENSOR_UUID: spectrogram
  POSSIBLE_ACTIONS: ["STOP", "MOVE_FORWARD", "TURN_LEFT", "TURN_RIGHT"]
  SPECTROGRAM_SENSOR:
    TYPE: "SpectrogramSensor"
  MEASUREMENTS:
    - "DISTANCE_TO_GOAL"
    - "SUCCESS"
    - "SPL"
  SUCCESS:
    SUCCESS_DISTANCE: 1.0

DATASET:
  TYPE: "AudioNav"
  SPLIT: "test_multiple"
  CONTENT_SCENES: ["*"]
  VERSION: "v1"
  SCENES_DIR: "data/scene_datasets/mp3d"
  DATA_PATH: "data/datasets/audionav/mp3d/{version}/{split}/{split}.json.gz"

COLLECT:
  OPEN: false

TEST:
  OPEN: false

TRAIN:
  OPEN: false
  MODE: offline_rl

RL:
  SUCCESS_REWARD: 10.0
  SLACK_REWARD: -0.01
  WITH_TIME_PENALTY: true
  WITH_DISTANCE_REWARD: true
  DISTANCE_REWARD_SCALE: 1.0
