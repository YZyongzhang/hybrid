SEED: 42
TASK_CONFIG:
  PT:
    OPEN: false
    FROM_PATH: /path/to/raw/pickle/train
    TO_PATH: data/avnav/train
    VAL_FROM_PATH: ""  # Optional independent validation pickle directory.
    VAL_TO_PATH: data/avnav/val
    SHARD_SIZE: 256
    SHUFFLE: true
  TRAIN:
    OPEN: true
    DATA_PATH: data/avnav/train  # A .pt file or directory of shards.
    DATA_PATHS: []  # Optional list combined with DATA_PATH for augmentation runs.
    VAL_DATA_PATH: ""  # Empty: split whole shards (episodes never cross shards).
    VAL_RATIO: 0.2
    BATCH_SIZE: 32
    NUM_WORKERS: 0
    CACHE_SIZE: 2  # Maximum resident shards per DataLoader worker.
    EPOCHS: 10
    LEARNING_RATE: 0.0001
    WEIGHT_DECAY: 0.0
    DEVICE: auto
    MODEL_PATH: ""  # Optional initial Network state_dict.
    SAVE_DIR: outputs/avnav/checkpoints
    TENSORBOARD: false
    LOG_DIR: outputs/avnav/tensorboard
