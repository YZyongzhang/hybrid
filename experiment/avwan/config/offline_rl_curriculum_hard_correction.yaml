# Parent-anchored curriculum: start on short paths, then progressively increase
# medium/long trajectories and audited, actually executed expert corrections.
TASK_CONFIG:
  TEST:
    OPEN: false
  TRAIN:
    OPEN: true
    MODE: offline_rl
    OFFLINE_RL:
      STAGE: all
      FRESH_FEATURES: false
      LONGRANGE_POOL: true
      FOUNDATION: result/2026-10-13-staged-grl-reproduction/foundation/action_stage/best.pt
      PARENT: result/2026-10-14-avwan-diverse-retraining/offline/seed_20261014_deverse_hard_longrange/training/best_policy.pt
      SOURCES:
        BASE: /data/Getuanhui/avwan_multiple_greedy_every_1000
        BASE_AUGMENT:
          - /data/Getuanhui/avwan_deverse_hard_longrange_20261014
        ADDITIONAL:
          - /data/Getuanhui/avwan_stop_negative_recovery_20261004/policy
          - /data/Getuanhui/avwan_stop_negative_recovery_20261004/recovery
        HARD_CORRECTION: result/2026-10-15-avwan-hard-corrections/collection
        VALIDATION: result/10-11/total/2026-10-03-unheard-generalization-study/validation_demonstrations
      CACHES:
        BASE: result/2026-10-14-avwan-diverse-retraining/offline/features/base
        ADDITIONAL: result/2026-10-14-avwan-diverse-retraining/offline/features/correction
        VALIDATION: result/2026-10-14-avwan-diverse-retraining/offline/features/validation
        HARD_CORRECTION: result/2026-10-15-avwan-hard-corrections/offline/features/hard_correction
      RUN:
        OUTPUT: result/2026-10-15-avwan-curriculum/offline
        NAME: seed_20261015_parent_anchored_curriculum
        SEED: 20261018
      EXTRACTION:
        DEVICE: cuda:0
        CPU_THREADS: 4
        BATCH_SIZE: 64
        EPISODE_BATCH_SIZE: 8
        WORKERS: 4
        MAX_EPISODES: 0
      TRAINING:
        DEVICE: cuda:0
        CPU_THREADS: 4
        EPOCHS: 6
        STEPS_PER_EPOCH: 500
        BATCH_SIZE: 32
        # Distance stages: <16m, 16-24m, >=24m, executed corrections,
        # failed STOP, recovery. Each phase runs 2 epochs (1,000 updates).
        SAMPLING: [20, 8, 0, 0, 2, 2]
        CURRICULUM_SCHEDULE:
          - NAME: short_path_warmup
            EPOCHS: 2
            SAMPLING: [20, 8, 0, 0, 2, 2]
          - NAME: medium_path_mixing
            EPOCHS: 2
            SAMPLING: [18, 6, 4, 2, 1, 1]
          - NAME: long_path_and_correction_focus
            EPOCHS: 2
            SAMPLING: [14, 4, 6, 6, 1, 1]
        GAMMA: 0.01
        BC_WEIGHT: 5.0
        ACTOR_RL_WEIGHT: 1.0
        CQL_WEIGHT: 1.0
        CQL_TEMPERATURE: 1.0
        ENTROPY_RATIO: 0.1
        INITIAL_ALPHA: 0.03
        TAU: 0.005
        LEARNING_RATE: 0.00001
        PARENT_ANCHOR_WEIGHT: 0.5
        WEIGHT_DECAY: 0.0
        GRAD_CLIP: 10.0
        HIDDEN_DIM: 256
        LSTM_LAYERS: 1
        TERMINAL_MASK: true
        FOUNDATION_PRIOR: true
        FAILED_STOP_PENALTY: 1.0
        GPU_MEMORY_FRACTION: 0.12
        MAX_RSS_MIB: 12000
        MIN_AVAILABLE_GIB: 12
      VALIDATION:
        EPISODES: 100
