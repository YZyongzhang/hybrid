ENVIRONMENT:
  MAX_EPISODE_STEPS: 200
SIMULATOR:
  HABITAT_SIM_V0:
    GPU_DEVICE_ID: 0
  SENSORS: ["DEPTH_SENSOR"]
  RGB_SENSOR:
    WIDTH: 128
    HEIGHT: 128
  DEPTH_SENSOR:
    WIDTH: 128
    HEIGHT: 128
  TYPE: "SoundSpacesSim"
  ACTION_SPACE_CONFIG: "v0"
  SCENE_DATASET: "mp3d"
  GRID_SIZE: 1.0
  AUDIO:
    RIR_SAMPLING_RATE: 16000

TASK:
  TYPE: AudioNav
  SUCCESS_DISTANCE: 1.0
  # These are TASK config keys; TYPE below is the registered sensor class.
  SENSORS:
    - "SPECTROGRAM_SENSOR"
    - "AngleSensor"
    - "PoseSensor"
    - "EGOMAP_SENSOR"
    - "COLLISION"
    - "GEOMETRIC_MAP"
    - "ACTION_MAP"
    - "ACOUSTIC_MAP"
    - "INTENSITY"
  GOAL_SENSOR_UUID: spectrogram
  POSSIBLE_ACTIONS: ["STOP", "MOVE_FORWARD", "TURN_LEFT", "TURN_RIGHT"]
  SPECTROGRAM_SENSOR:
    TYPE: "SpectrogramSensor"
  AngleSensor:
    TYPE: "AngleSensor"
  PoseSensor:
    TYPE: "PoseSensor"
  EGOMAP_SENSOR:
    TYPE: "EgoMap"
    MAP_SIZE: 31
    MAP_RESOLUTION: 0.1
    HEIGHT_THRESH: [0.5, 2.0]
    # Match SIMULATOR.DEPTH_SENSOR.POSITION (Habitat default).
    POSITION: [0, 1.25, 0]
  COLLISION:
    TYPE: "Collision"
  GEOMETRIC_MAP:
    TYPE: "GeometricMap"
    MAP_SIZE: 400
    INTERNAL_MAP_SIZE: 1200
    MAP_RESOLUTION: 0.1
    NUM_CHANNEL: 2
  ACTION_MAP:
    TYPE: "ActionMap"
    # 81 waypoint actions; center cell 40 is STOP.
    MAP_SIZE: 9
    # Match SIMULATOR.GRID_SIZE for the discrete MP3D simulator.
    MAP_RESOLUTION: 1.0
    NUM_CHANNEL: 1
  # Planner reads this config even when the acoustic sensor is disabled.
  ACOUSTIC_MAP:
    TYPE: "AcousticMap"
    MAP_SIZE: 20
    MAP_RESOLUTION: 1.0
    NUM_CHANNEL: 1
    ENCODING: "average_intensity"
  INTENSITY:
    TYPE: "Intensity"
  MEASUREMENTS:
    - "DISTANCE_TO_GOAL"
    - "NORMALIZED_DISTANCE_TO_GOAL"
    - "SUCCESS"
    - "SPL"
    - "SOFT_SPL"
    - "NUM_ACTION"
    - "SUCCESS_WEIGHTED_BY_NUM_ACTION"
    - "TOP_DOWN_MAP"
  SUCCESS:
    SUCCESS_DISTANCE: 1.0
  TOP_DOWN_MAP:
    MAP_RESOLUTION: 500
    DRAW_SOURCE_AND_TARGET: True
    DRAW_BORDER: True
    DRAW_SHORTEST_PATH: True



COLLECT:
  OPEN: true
  TYPE: greedy
  RESUME: true  # Skip scenes that already have collected data in TO_PATH.
  TO_PATH: "/data/Getuanhui/avwan_multiple_greedy_train"



DATASET:
  TYPE: "AudioNav"
  SPLIT: "val_telephone"
  CONTENT_SCENES: ["*"]
  VERSION: "v1"
  SCENES_DIR: "data/scene_datasets/mp3d"
  DATA_PATH: "data/datasets/audionav/mp3d/{version}/{split}/{split}.json.gz"

# TRAIN.OPEN=true selects training directly in run_avwan.py, before collection.
# Relative DATA/OUTPUT/RESUME paths are rooted at experiment/avwan.
TRAIN:
  OPEN: false
  STAGE: all
  RESUME: ''
  SEED: 20260925
  DATA:
    SOURCE: /data/Getuanhui/avwan_telephone_greedy_train
    VAL_SOURCE: /data/Getuanhui/avwan_telephone_greedy_val
    CACHE: data_cache/telephone_train_val_spatial_v3
    INPUTS:
    - rgb
    - depth
    - spectrogram
    - gm
    - am
    SHARD_SIZE: 512
    CONVERT_WORKERS: 4
    VAL_FRACTION: 0.1
    SPLIT_BY: scene
    MAX_EPISODES: 0
  OUTPUT: runs/telephone_train_val_20260925
  DEVICE: auto
  EPOCHS: 30
  BATCH_SIZE: 64
  WORKERS: 4
  PREFETCH_FACTOR: 2
  PIN_MEMORY: true
  CPU_THREADS: 4
  LEARNING_RATE: 0.0003
  WEIGHT_DECAY: 0.0
  ACTION_LOSS_WEIGHT: 1.0
  ANGLE_LOSS_WEIGHT: 1.0
  GRAD_CLIP: 10.0
  AMP: true
  LOG_EVERY: 50
  MAX_BATCHES: 0
  TENSORBOARD: true
  SAVE_TOP_K: 3
