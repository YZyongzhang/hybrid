# Offline SAC-CQL training on DeverseCollect episodes.
# Collect DeverseCollect training episodes into this root before training.
seed: 20261006
device: cuda
cpu_threads: 4

features:
  # Frozen AV-WaN foundation trained for the multiple-source task.
  checkpoint: runs/multiple_train_val_20261006/foundation_weights.pt
  source: /data/Getuanhui/avwan_multiple_deverse_train
  cache: data_cache/multiple_deverse_foundation_rl_v1
  batch_size: 64
  episode_batch_size: 8
  workers: 4
  max_episodes: 0  # 0 means use every saved episode.

training:
  output: runs/multiple_deverse_offline_saccql_20261006
  epochs: 30
  batch_size: 32
  hidden_dim: 256
  lstm_layers: 1
  learning_rate: 0.0003
  gamma: 0.99
  initial_alpha: 0.1
  entropy_ratio: 0.5
  tau: 0.005
  cql_weight: 1.0
  cql_temperature: 1.0
  grad_clip: 10.0
  log_every: 100
  tensorboard: true
