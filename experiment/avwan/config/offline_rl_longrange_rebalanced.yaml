# Controlled reweighting trial: keep the frozen caches and held-out validation,
# but draw the targeted train-only long-range demonstrations as their own pool.
TASK_CONFIG:
  TEST:
    OPEN: false
  TRAIN:
    OPEN: true
    MODE: offline_rl
    OFFLINE_RL:
      STAGE: all
      FRESH_FEATURES: false
      LONGRANGE_POOL: true
      FOUNDATION: result/2026-10-13-staged-grl-reproduction/foundation/action_stage/best.pt
      PARENT: null
      SOURCES:
        BASE: /data/Getuanhui/avwan_multiple_greedy_every_1000
        BASE_AUGMENT:
          - /data/Getuanhui/avwan_deverse_hard_longrange_20261014
        ADDITIONAL:
          - /data/Getuanhui/avwan_stop_negative_recovery_20261004/policy
          - /data/Getuanhui/avwan_stop_negative_recovery_20261004/recovery
        VALIDATION: result/10-11/total/2026-10-03-unheard-generalization-study/validation_demonstrations
      CACHES:
        BASE: result/2026-10-14-avwan-diverse-retraining/offline/features/base
        ADDITIONAL: result/2026-10-14-avwan-diverse-retraining/offline/features/correction
        VALIDATION: result/2026-10-14-avwan-diverse-retraining/offline/features/validation
      RUN:
        OUTPUT: result/2026-10-14-avwan-diverse-retraining/longrange_oversampling/offline
        NAME: seed_20261015_longrange_rebalanced
        SEED: 20261015
      EXTRACTION:
        DEVICE: cuda:0
        CPU_THREADS: 4
        BATCH_SIZE: 64
        EPISODE_BATCH_SIZE: 8
        WORKERS: 4
        MAX_EPISODES: 0
      TRAINING:
        DEVICE: cuda:0
        CPU_THREADS: 4
        EPOCHS: 20
        STEPS_PER_EPOCH: 500
        BATCH_SIZE: 32
        # original, long-range, failed-STOP, recovery
        SAMPLING: [16, 4, 6, 6]
        GAMMA: 0.01
        BC_WEIGHT: 5.0
        ACTOR_RL_WEIGHT: 1.0
        CQL_WEIGHT: 1.0
        CQL_TEMPERATURE: 1.0
        ENTROPY_RATIO: 0.1
        INITIAL_ALPHA: 0.03
        TAU: 0.005
        LEARNING_RATE: 0.0001
        WEIGHT_DECAY: 0.0
        GRAD_CLIP: 10.0
        HIDDEN_DIM: 256
        LSTM_LAYERS: 1
        TERMINAL_MASK: true
        FOUNDATION_PRIOR: true
        FAILED_STOP_PENALTY: 1.0
      VALIDATION:
        EPISODES: 100
