# Train a fresh SAC-CQL actor on the temporal foundation for the v2 protocol.
TASK_CONFIG:
  TEST:
    OPEN: false
  TRAIN:
    OPEN: true
    MODE: offline_rl
    OFFLINE_RL:
      STAGE: all
      FRESH_FEATURES: true
      LONGRANGE_POOL: false
      SEPARATE_HARD_CORRECTION_POOL: false
      FOUNDATION: result/2026-10-17-unheard-generalization-v2-reproduction/temporal-foundation/training/best.pt
      PARENT: null
      SOURCES:
        BASE: result/2026-10-17-unheard-generalization-v2-reproduction/train-snapshot
        ADDITIONAL:
          - /data/Getuanhui/avwan_stop_negative_recovery_20261004/policy
          - /data/Getuanhui/avwan_stop_negative_recovery_20261004/recovery
        VALIDATION: result/10-11/total/2026-10-03-unheard-generalization-study/validation_demonstrations
      CACHES:
        BASE: result/2026-10-17-unheard-generalization-v2-reproduction/offline/features/base
        ADDITIONAL: result/2026-10-17-unheard-generalization-v2-reproduction/offline/features/additional
        VALIDATION: result/2026-10-17-unheard-generalization-v2-reproduction/offline/features/validation
      RUN:
        OUTPUT: result/2026-10-17-unheard-generalization-v2-reproduction/offline
        NAME: seed_20261017_temporal
        SEED: 20261017
      EXTRACTION:
        DEVICE: cuda:0
        CPU_THREADS: 2
        BATCH_SIZE: 8
        EPISODE_BATCH_SIZE: 2
        WORKERS: 1
        MAX_EPISODES: 0
        GPU_MEMORY_FRACTION: 0.12
        MIN_AVAILABLE_GIB: 12
      TRAINING:
        DEVICE: cuda:0
        CPU_THREADS: 2
        METHOD: sac_cql
        EPOCHS: 20
        STEPS_PER_EPOCH: 500
        BATCH_SIZE: 32
        SAMPLING: [16, 8, 8]
        GAMMA: 0.01
        BC_WEIGHT: 5.0
        ACTOR_RL_WEIGHT: 1.0
        CQL_WEIGHT: 1.0
        CQL_TEMPERATURE: 1.0
        ENTROPY_RATIO: 0.1
        INITIAL_ALPHA: 0.03
        TAU: 0.005
        LEARNING_RATE: 0.0001
        WEIGHT_DECAY: 0.0
        GRAD_CLIP: 10.0
        HIDDEN_DIM: 256
        LSTM_LAYERS: 1
        TERMINAL_MASK: true
        FOUNDATION_PRIOR: true
        FAILED_STOP_PENALTY: 1.0
        GPU_MEMORY_FRACTION: 0.12
        MAX_RSS_MIB: 12000
        MIN_AVAILABLE_GIB: 12
      VALIDATION:
        EPISODES: 100
